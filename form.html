<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Community - Join Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Tech Community</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link active" href="form.html">Join Us</a>
                <a class="nav-link" href="gallery.html">Multimedia</a>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="card shadow-sm mx-auto" style="max-width: 500px;">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Daftar Anggota</h2>
                <form id="memberForm">
                    <div class="mb-3">
                        <label class="form-label">Nama Lengkap</label>
                        <input type="text" id="userName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="userEmail" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Bidang Minat</label>
                        <select id="userInterest" class="form-select" required>
                            <option value="" disabled selected>Pilih Bidang...</option>
                            <option value="Web Development">Web Development</option>
                            <option value="Cyber Security">Cyber Security</option>
                            <option value="UI/UX Design">UI/UX Design</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Kirim Data</button>
                </form>
            </div>
        </div>
        <div id="displayArea" class="mt-4 p-3 bg-white border rounded shadow-sm d-none mx-auto" style="max-width: 500px;">
            <h5 class="text-success border-bottom pb-2">Konfirmasi Pendaftaran:</h5>
            <div id="contentResult"></div>
        </div>
        <div class="text-center mt-3">
            <a href="index.html" class="btn btn-link text-decoration-none">Kembali ke Halaman Utama</a>
        </div>
    </div>
    <script>
        const memberData = [];
        document.getElementById('memberForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;
            const interest = document.getElementById('userInterest').value;
            const entry = { name, email, interest };
            memberData.push(entry);
            alert('Selamat ' + name + ', data Anda telah disimpan sementara!');
            document.getElementById('contentResult').innerHTML = 
                '<p><strong>Nama:</strong> ' + name + '</p>' +
                '<p><strong>Email:</strong> ' + email + '</p>' +
                '<p><strong>Minat:</strong> ' + interest + '</p>';
            document.getElementById('displayArea').classList.remove('d-none');
            this.reset();
        });
    </script>
</body>
</html>
