<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Community - Gabung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Tech Community</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Beranda</a>
                <a class="nav-link active" href="form.html">Pendaftaran</a>
                <a class="nav-link" href="gallery.html">Multimedia</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="form-container">
            <div class="card shadow p-4">
                <h2 class="text-center mb-4">Formulir Anggota</h2>
                <form id="memberForm">
                    <div class="mb-3">
                        <label class="form-label">Nama Lengkap</label>
                        <input type="text" id="userName" class="form-control" placeholder="Masukkan nama" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Alamat Email</label>
                        <input type="email" id="userEmail" class="form-control" placeholder="nama@email.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Bidang Minat</label>
                        <select id="userInterest" class="form-select" required>
                            <option value="" disabled selected>Pilih Bidang...</option>
                            <option value="Networking">Networking</option>
                            <option value="Programming">Programming</option>
                            <option value="Design">UI/UX Design</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-custom">Daftar Sekarang</button>
                </form>

                <div id="displayArea" class="d-none">
                    <hr>
                    <h5>Hasil Input Terakhir:</h5>
                    <div id="contentResult"></div>
                </div>
                
                <div class="text-center mt-4">
                    <a href="index.html" class="text-secondary text-decoration-none">&larr; Kembali ke Beranda</a>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
