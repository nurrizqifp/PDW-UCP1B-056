<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Community | Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Tech Community</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link active" href="form.html">Join Us</a>
                <a class="nav-link" href="gallery.html">Multimedia</a>
            </div>
        </div>
    </nav>

    <div class="container d-flex flex-column align-items-center">
        <div class="card shadow p-4 w-100" style="max-width: 500px;">
            <h2 class="text-center mb-4">Pendaftaran Anggota</h2>
            <form id="memberForm">
                <div class="mb-3">
                    <label class="form-label">Nama</label>
                    <input type="text" id="userName" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="userEmail" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Minat</label>
                    <select id="userInterest" class="form-select" required>
                        <option value="" disabled selected>Pilih Bidang...</option>
                        <option value="Networking">Networking</option>
                        <option value="Web Development">Web Development</option>
                        <option value="Data Science">Data Science</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">Simpan Data</button>
            </form>

            <div id="displayArea" class="mt-4 d-none">
                <h6 class="text-secondary">Berhasil Input:</h6>
                <div id="contentResult"></div>
            </div>

            <div class="mt-4 text-center">
                <a href="./index.html" class="btn btn-link text-decoration-none">Kembali ke Utama</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
