<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Community - Multimedia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Tech Community</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="form.html">Join Us</a>
                <a class="nav-link active" href="gallery.html">Multimedia</a>
            </div>
        </div>
    </nav>
    <div class="container mt-5 mb-5 text-center">
        <h2 class="mb-5">Galeri Tech Community</h2>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card h-100 shadow-sm p-3">
                    <img id="techImg" src="https://picsum.photos/400/250?tech" class="card-img-top rounded mb-3" alt="Tech Image">
                    <button class="btn btn-outline-info" onclick="changeImage()">Ganti Visual</button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 shadow-sm p-3 text-center">
                    <div class="ratio ratio-16x9 mb-3 border rounded overflow-hidden">
                        <iframe src="https://www.youtube.com/embed/fHI8X4OXW6Y" title="YouTube video" allowfullscreen></iframe>
                    </div>
                    <button class="btn btn-outline-warning" onclick="alert('Video ini menjelaskan tren teknologi 2026')">Info Video</button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 shadow-sm p-3">
                    <div class="bg-dark p-4 rounded text-white mb-3">
                        <p class="mb-1">Podcasting Audio</p>
                        <audio id="audioPlayer" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"></audio>
                    </div>
                    <div class="d-flex justify-content-center gap-2">
                        <button class="btn btn-success" onclick="controlAudio('play')">Play</button>
                        <button class="btn btn-danger" onclick="controlAudio('pause')">Stop</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function changeImage() {
            document.getElementById('techImg').src = 'https://picsum.photos/400/250?random=' + Math.floor(Math.random() * 100);
        }
        function controlAudio(action) {
            const player = document.getElementById('audioPlayer');
            if (action === 'play') {
                player.play();
            } else {
                player.pause();
            }
        }
    </script>
</body>
</html>
