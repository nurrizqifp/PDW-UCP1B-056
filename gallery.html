<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Community | Multimedia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Tech Community</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="form.html">Join Us</a>
                <a class="nav-link active" href="gallery.html">Multimedia</a>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <h2 class="text-center mb-5">Galeri Media</h2>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card h-100 p-3 shadow-sm media-box">
                    <img id="techImg" src="https://picsum.photos/400/250?tech" alt="Random Tech">
                    <button class="btn btn-outline-dark mt-3" onclick="changeImage()">Ganti Gambar</button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 p-3 shadow-sm">
                    <div class="ratio ratio-16x9">
                        <iframe width="560" height="315" src="https://www.youtube.com/embed/LPZh9BOjkQs?si=rT6QU29CfKJmbvDz" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                    </div>
                    <button class="btn btn-outline-info mt-3" onclick="alert('Video Embed dari YouTube')">Info Video</button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 p-3 shadow-sm text-center">
                    <div class="p-4 bg-light rounded border mb-3">
                        <audio id="audioPlayer" src="https://codeskulptor-demos.commondatastorage.googleapis.com/GalaxyInvaders/theme_01.mp3"></audio>
                        <p class="mb-0 text-muted">Audio Sample</p>
                    </div>
                    <div class="d-flex justify-content-center gap-2">
                        <button class="btn btn-success px-4" onclick="controlAudio('play')">Play</button>
                        <button class="btn btn-danger px-4" onclick="controlAudio('pause')">Stop</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
